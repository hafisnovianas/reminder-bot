name: Deploy reminder-bot

on:
  push:
    branches: [main]

jobs:
  # Gerbang mutu: deploy TIDAK boleh jalan kalau tahap ini gagal.
  # Dibuat setelah kejadian syntax error di lib/auto-backup.js lolos ke server
  # dan membuat bot mati total (require gagal sebelum WA/DB sempat dimuat).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependency
        run: npm ci

      - name: Cek sintaks semua file JS
        run: |
          node --check index.js
          for f in lib/*.js test/*.js; do
            echo "  memeriksa $f"
            node --check "$f"
          done



  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Copy kode ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "index.js,package.json,package-lock.json,lib,test"
          target: ${{ secrets.TARGET_DIR }}
          overwrite: true

      - name: Install dependency dan restart bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.TARGET_DIR }}
            npm ci --omit=dev

            # Server umumnya UTC. Tanpa TZ ini, "besok jam 8" jadi 15:00 WIB.
            # index.js juga sudah punya default Asia/Jakarta sebagai pengaman.
            export TZ=Asia/Jakarta

            # Nomor tujuan auto-backup. Sengaja lewat secret, bukan di source
            # code, karena isinya nomor pribadi. Kalau secret ini belum dibuat,
            # bot tetap jalan normal dan hanya melewati fitur backup.
            export ADMIN_WA='${{ secrets.ADMIN_WA }}'
            export GOOGLE_DRIVE_FOLDER_ID='${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}'
            export GOOGLE_CREDENTIALS='${{ secrets.GOOGLE_CREDENTIALS }}'
            export GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}'

            # restart dulu; kalau prosesnya memang belum ada, baru start.
            # --update-env agar TZ di atas benar-benar terbawa ke proses baru.
            pm2 restart reminder-bot --update-env || pm2 start index.js --name reminder-bot

            # Supaya bot hidup lagi sendiri setelah server reboot.
            pm2 save
